name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "HTTPS URL of the deployed Albert's AI Song Studio web app"
        required: true
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Validate app URL
        env:
          APP_URL: ${{ inputs.app_url }}
        shell: bash
        run: |
          case "$APP_URL" in
            https://*) ;;
            *) echo "The app URL must start with https://"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Create and sync Android project
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.app_url }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: alberts-ai-song-studio-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
